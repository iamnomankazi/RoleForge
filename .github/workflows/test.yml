name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # Skip the postinstall and install Chromium explicitly: the application-form
      # and PDF tests launch a headless browser against local fixtures.
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node test-all.mjs --quick
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard
