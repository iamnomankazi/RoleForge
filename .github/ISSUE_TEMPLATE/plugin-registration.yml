name: Plugin registration
description: Register your career-ops-plugin-<name> repo so it can be listed as a reviewed RoleForge plugin
labels: ["plugin-submission", "area:plugins"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Privacy first.** Never paste your CV, scan results, or other personal data — issue content is stored on GitHub, even in this private repository.

        Use this issue to track plugin review and compatibility. To propose a registry entry, open a PR for the exact reviewed plugin commit. See [docs/PLUGINS.md](https://github.com/iamnomankazi/RoleForge/blob/main/docs/PLUGINS.md).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and data contract
      options:
        - label: I have removed private user data and followed the [Data Contract](https://github.com/iamnomankazi/RoleForge/blob/main/DATA_CONTRACT.md)
          required: true
  - type: input
    id: repo
    attributes:
      label: Repo URL
      description: Must be named `career-ops-plugin-<name>` for compatibility (a public GitHub repo you own).
      placeholder: https://github.com/your-user/career-ops-plugin-greenhouse
    validations:
      required: true
  - type: input
    id: desc
    attributes:
      label: One-line description
      description: Mission-framed, what it does.
    validations:
      required: true
  - type: textarea
    id: hooks
    attributes:
      label: Hooks + keys + hosts
      description: Which hooks (provider/ingest/search/notify/export), which env keys it needs, which hosts it talks to.
    validations:
      required: true
  - type: checkboxes
    id: attest
    attributes:
      label: Attestations
      options:
        - label: It is human-in-the-loop — it never auto-submits an application
          required: true
        - label: It reads PUBLIC data or the user's OWN account only — no centralized infrastructure
          required: true
        - label: MIT-compatible license; no personal data in the repo
          required: true
        - label: No commercial / hosted-service / monetization wording — RoleForge is local-first
          required: true
