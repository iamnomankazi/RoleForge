name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Privacy first.** RoleForge runs locally. **Never** paste your CV, scan results, pipeline data, job listings, or other personal info — issue content is stored on GitHub, even in this private repository. Keep your data on your machine; share only sanitized snippets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and data contract
      options:
        - label: I have removed private user data and followed the [Data Contract](https://github.com/iamnomankazi/RoleForge/blob/main/DATA_CONTRACT.md)
          required: true
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why do you need this?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Evaluation / Scoring
        - PDF Generation
        - Portal Scanner
        - Dashboard TUI
        - Batch Processing
        - Language / i18n
        - Documentation
        - Other
    validations:
      required: true
